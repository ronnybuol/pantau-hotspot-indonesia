name: Quality Control

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate web data
        run: node scripts/validate_web_data.mjs
      - name: Build static site
        run: npm run build
      - name: Check required build files
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/style.css
          test -f dist/data/meta.json
          test -f dist/data/months-upload/manifest.json
